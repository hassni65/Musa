name: WM 2026 – Deploy zu GitHub Pages

on:
  push:
    branches: [claude/wm-2026-tipping-app-y3suww, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Pakete installieren
        run: npm install
        working-directory: frontend

      - name: App bauen
        run: npm run build -- --outDir dist --base ./
        working-directory: frontend

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v4

      - name: Build-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
